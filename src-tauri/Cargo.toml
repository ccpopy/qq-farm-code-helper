[package]
name = "qq-farm-code-helper"
version = "0.1.9"
description = "Windows QQ 农场一次性 Code 本地获取助手"
authors = ["ccpopy"]
edition = "2024"
homepage = "https://github.com/ccpopy/qq-farm-code-helper"
repository = "https://github.com/ccpopy/qq-farm-code-helper"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
getrandom = "0.3"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
prost = "0.14"
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.12.24", features = ["json"] }
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.12.0"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
url = "2.5.7"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
